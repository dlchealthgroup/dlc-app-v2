<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLC OS</title>
<meta name="theme-color" content="#0E2F52">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="apple-touch-icon" href="./dlc-apple-touch-180.png">
<style>
:root{
  --navy:#0E2F52; --navy-2:#17457A; --sky:#2B6CB0; --sky-soft:#EAF1F8;
  --bg:#F5F7FA; --panel:#fff; --ink:#16212F; --muted:#5E6E80; --line:#E2E8F0;
  --warn:#B45309; --warn-bg:#FEF3E2; --ok:#12805C; --ok-bg:#E7F6F0; --dang:#9B2C2C;
  --r:14px; --sh:0 1px 2px rgba(16,32,52,.05), 0 8px 24px rgba(16,32,52,.05);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.sm{font-size:12.5px;color:var(--muted)}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}

/* ---------- acceso ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, #E8F0F8 0%, var(--bg) 60%)}
.lbox{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--sh)}
.lbox img{height:36px;margin-bottom:22px}
.lbox h1{font-size:20px;color:var(--navy)}
.lbox p.sub{margin:6px 0 20px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);min-height:44px}
input:focus,select:focus{outline:2px solid var(--sky);background:#fff}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;min-height:44px}
.btn:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn.sec{background:var(--panel);color:var(--navy)}
.btn.block{width:100%;margin-top:20px}
.btn[disabled]{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:13.5px;color:var(--dang);min-height:20px}

/* ---------- cabecera ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center}
.top img.logo{height:28px}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch input{padding-left:36px;min-height:40px;background:var(--bg);border-radius:10px}
.gsearch::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.uwrap{position:relative;margin-left:auto}
.ubtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.uname{font-size:13.5px;font-weight:600;color:var(--navy)}
.umenu{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);min-width:230px;padding:6px;z-index:60}
.umenu .uh{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.umenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.umenu button:hover{background:var(--bg)}
.umenu button.sal{color:var(--dang)}

/* ---------- navegación ---------- */
nav.main{border-bottom:1px solid var(--line);background:var(--panel)}
nav.main .in{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}
nav.main .in::-webkit-scrollbar{display:none}
nav.main button{position:relative;border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.main button[aria-selected=true]{color:var(--navy)}
nav.main button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--navy);border-radius:2px}
nav.main button:disabled{opacity:.45;cursor:default}
nav.main .pronto{font-size:10px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:6px;color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}

/* ---------- inicio ---------- */
.saludo{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.saludo h1{font-size:23px;color:var(--navy)}
.saludo .fecha{color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:27px;color:var(--navy);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.kpi.click{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.kpi.click:hover{transform:translateY(-2px);border-color:var(--navy);box-shadow:0 8px 20px rgba(16,32,52,.1)}

.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.card>h2{font-size:14.5px;color:var(--navy);padding:14px 16px 0;display:flex;align-items:center;gap:8px}
.card>h2 .n{font-size:11.5px;font-weight:700;background:var(--sky-soft);color:var(--navy);border-radius:999px;padding:2px 8px}
.card>p.sm{padding:4px 16px 0;margin:0}
.lista{padding:8px 6px 6px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--bg)}
.item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;background:var(--sky-soft);color:var(--navy)}
.item .ic.w{background:var(--warn-bg);color:var(--warn)} .item .ic.o{background:var(--ok-bg);color:var(--ok)}
.item .tx{min-width:0;flex:1}
.item .tx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacio{padding:16px;color:var(--muted);font-size:13.5px}
.verlo{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);padding:11px;font-weight:650;color:var(--navy);cursor:pointer;font-size:13.5px}
.skel{height:14px;background:linear-gradient(90deg,#EEF2F7,#F7FAFC,#EEF2F7);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;margin:12px 16px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- directorio ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.filtros label{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px}
.chips:not(:empty){padding:12px 14px 0}
.chip{background:var(--sky-soft);color:var(--navy);border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.cuenta{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px}
.cuenta b{color:var(--navy);font-size:17px}
.fila{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.fila:hover{background:var(--bg)}
.fila .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-urg{background:var(--warn-bg);color:var(--warn)}
.p-est{background:var(--sky-soft);color:var(--navy)}
.dias{display:flex;gap:3px}
.dias span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dias span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mas{width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);padding:13px;font-weight:650;color:var(--navy);cursor:pointer}

/* ---------- ficha ---------- */
dialog{border:0;border-radius:16px;padding:0;max-width:660px;width:calc(100% - 28px);box-shadow:0 24px 60px rgba(10,20,30,.28)}
dialog::backdrop{background:rgba(14,47,82,.4)}
.fbox{padding:22px}
.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.fh h2{font-size:19px;color:var(--navy)}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.blk{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:12px}
.blk h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}


/* ---------- acciones, formularios y avisos ---------- */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.acts .btn{padding:9px 14px;min-height:40px;font-size:14px}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--panel)}
.btn.dang{border-color:var(--dang);background:var(--dang);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);cursor:pointer;text-align:left;font-size:14px}
.opt .mk{width:16px;height:16px;border:2px solid var(--line);border-radius:5px;flex:0 0 auto}
.opt.neg .mk{border-radius:50%}
.opt[aria-pressed=true]{border-color:var(--navy);background:var(--sky-soft)}
.opt[aria-pressed=true] .mk{background:var(--navy);border-color:var(--navy)}
.dp{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin-top:6px}
.dprow{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:start;margin-bottom:6px}
.dprow b{font-size:13px;padding-top:8px}
.dpc{display:flex;flex-direction:column;gap:5px}
.dpt{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.dpt[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.dph{display:flex;gap:5px;align-items:center}
.dph input{min-height:34px;padding:5px 6px;font-size:13px}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qk button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer}
.cons{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;position:relative}
.cons .quitar{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--dang);cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(10,20,30,.25);font-size:14px}
.toast.err{background:var(--dang)}
.dupbox{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px;padding:12px;margin-top:12px}
.dupbox .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(180,83,9,.2)}
@media (max-width:620px){.g2,.opciones{grid-template-columns:1fr}.dprow{grid-template-columns:52px 1fr 1fr}}

.conex{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:80;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(10,20,30,.18)}
.conex.off{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.conex.esp{background:var(--sky-soft);color:var(--navy);border:1px solid var(--sky)}
.item .acts .btn{padding:6px 10px;min-height:32px;font-size:12.5px}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;font-weight:600;color:var(--navy);cursor:pointer}
.subnav button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt input[type=checkbox]{width:18px;height:18px;min-height:0}

/* ---------- mapa, ficha lateral y móvil ---------- */
#mapa{height:min(65vh,560px);width:100%}
.mapleg{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.mapleg i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.mpin span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
dialog#ficha{max-width:520px;width:100%;height:100dvh;max-height:100dvh;margin:0 0 0 auto;border-radius:18px 0 0 18px;animation:entra .18s ease-out}
dialog#ficha .fbox{height:100%;overflow:auto;padding-bottom:40px}
@keyframes entra{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.upd{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;z-index:95;box-shadow:0 12px 30px rgba(10,20,30,.3)}
.upd .btn{background:#fff;color:var(--navy);border-color:#fff;padding:7px 12px;min-height:34px}
.bnav{display:none}
@media (max-width:760px){
  nav.main{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:70;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;padding:9px 4px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}
  .bnav button span{font-size:17px}
  .bnav button[aria-selected=true]{color:var(--navy)}
  main{padding-bottom:78px}
  .conex,.upd{bottom:86px}
  dialog#ficha{max-width:none;border-radius:0}
}

.rutabar{position:fixed;left:0;right:0;top:0;z-index:95;background:#12805C;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.rutabar .rt{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.rutabar .btn{min-height:34px;padding:6px 12px}
.rutabar .btn.sec{background:#fff;color:#12805C;border-color:#fff}
body.conruta header{top:46px}
body.conruta{padding-top:46px}
.kcfg{border:0;background:none;color:var(--navy);font-weight:600;cursor:pointer;font-size:13px;padding:0}
@media (max-width:760px){.rutabar{font-size:13px;padding:8px 12px}}

.mini{max-width:420px;width:calc(100% - 28px);border-radius:16px}
.mini .fbox{padding:20px}
.tabla{overflow-x:auto}
.thead{display:flex;gap:0;border-top:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tcell{padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.th{position:relative}
.th .res{position:absolute;right:-4px;top:0;width:9px;height:100%;cursor:col-resize;touch-action:none}
.th .res::after{content:"";position:absolute;right:4px;top:25%;height:50%;width:2px;background:var(--line);border-radius:2px}
.th:hover .res::after{background:var(--navy)}
.trow{display:flex;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;padding:0;align-items:center}
.trow:hover{background:var(--bg)}
.trow .nm{font-weight:600}

.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 16px 16px}
.mesdow{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.mesdia{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:62px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mesdia:hover{border-color:var(--navy)}.mesdia.hoy{border-color:var(--navy);box-shadow:0 0 0 2px rgba(14,47,82,.12)}
.mesdia b{font-size:13px;color:var(--ink)}
.mespunto{font-size:11px;font-weight:700;background:var(--sky-soft);color:var(--navy);border-radius:999px;padding:1px 7px}
.btn.sec.dang{color:var(--dang);border-color:var(--dang);background:var(--panel)}

.gsug{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(16,32,52,.16);max-height:60vh;overflow:auto;z-index:70}
.gsug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer}
.gsug button:hover{background:var(--bg)}
.gsug b{display:block;font-size:14px}.gsug .gic{font-size:16px;width:22px;text-align:center}
.gsh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px 3px;background:var(--bg);border-bottom:1px solid var(--line)}
.cargador{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:44px 16px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:gira .8s linear infinite;display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.dl-wrap{position:relative;display:inline-block}
.dl-btn{font-size:17px;min-width:44px}
.dl-menu{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(16,32,52,.16);min-width:200px;padding:6px;z-index:60}
.dl-menu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px}
.dl-menu button:hover{background:var(--bg)}

.tools{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-12px 0 40px rgba(16,32,52,.12);transform:translateX(105%);transition:transform .2s ease;z-index:85;overflow:auto}
.tools.abierto{transform:none}
.tools .tbox{padding:18px 18px 40px}
.tools h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.totbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.totbox div{display:flex;justify-content:space-between;padding:3px 0;font-size:13.5px}
.totbox .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:7px;font-size:15px}
.grupo{margin-bottom:14px}
.grupoh{width:100%;text-align:left;border:0;background:none;padding:8px 2px;cursor:pointer;font-size:15px;color:var(--navy)}
.grupoh .sm{margin-left:8px}
.grupoc{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cat-card{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cat-card:hover{border-color:var(--navy);box-shadow:0 6px 18px rgba(16,32,52,.08)}
.cat-h{display:flex;gap:8px;align-items:center}.cat-h b{color:var(--navy);font-size:15px}
.tagsis{font-size:10.5px;font-weight:700;background:var(--sky-soft);color:var(--navy);border-radius:999px;padding:1px 7px}
.tagro{margin-left:auto;font-size:13px;opacity:.6}
.cat-v{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.cat-v .chip{font-size:11.5px;padding:2px 9px}
.dayhead2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#dlg2{max-width:620px}
@media (max-width:900px){ .cols{grid-template-columns:1fr} }
@media (max-width:760px){
  .fila{grid-template-columns:minmax(0,1fr) auto}
  .fila .c2,.fila .c3{display:none}
  .gsearch{order:3;flex-basis:100%;max-width:none}
  .top{flex-wrap:wrap}
  main{padding:16px 12px 50px}
}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="lform">
    <img src="./logo.png" alt="DLC Health Group">
    <h1>DLC OS</h1>
    <p class="sub">Entra con tu correo y contraseña.</p>
    <label for="lu">Correo</label>
    <input id="lu" type="email" autocomplete="username" required>
    <label for="lp">Contraseña</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn block" id="lbtn">Entrar</button>
    <div class="msg" id="lmsg"></div>
  </form>
</section>

<div id="app" class="hide">
  <header>
    <div class="top">
      <img class="logo" src="./logo.png" alt="DLC">
      <div class="gsearch"><input id="q" type="search" placeholder="Buscar médico, centro o municipio" autocomplete="off"><div class="gsug hide" id="gsug"></div></div>
      <div class="uwrap">
        <button class="ubtn" id="ubtn"><span class="av" id="av"></span><span class="uname" id="uname"></span></button>
        <div class="umenu hide" id="umenu">
          <div class="uh"><div id="umnom" style="font-weight:600"></div><div class="sm" id="umrol"></div></div>
          <button data-u="cfg">Configuración</button>
          <button data-u="pass">Cambiar contraseña</button>
          <button data-u="adm" class="hide">Administración</button>
          <button data-u="salir" class="sal">Cerrar sesión</button>
        </div>
      </div>
    </div>
    <nav class="main"><div class="in" id="nav">
      <button data-t="inicio" aria-selected="true">Inicio</button>
      <button data-t="agenda" aria-selected="false">Agenda</button>
      <button data-t="rutas" aria-selected="false">Rutas</button>
      <button data-t="directorio" aria-selected="false">Directorio</button>
      <button data-t="seguimiento" aria-selected="false">Seguimiento</button>
      <button data-t="ventas" aria-selected="false">Ventas</button>
      <button data-t="analitica" aria-selected="false">Analítica</button>
      <button disabled>Facturación<span class="pronto">Pronto</span></button>
    </div></nav>
  </header>

  <main>
    <section id="v-inicio">
      <div class="saludo">
        <div><h1 id="hola">Hola</h1><div class="fecha" id="hoyfecha"></div></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="cols">
        <div>
          <div class="card" id="c-comision"></div>
          <div class="card" id="c-agenda"></div>
          <div class="card" id="c-acciones"></div>
        </div>
        <div>
          <div class="card" id="c-urgentes"></div>
          <div class="card" id="c-ultimas"></div>
        </div>
      </div>
    </section>

    <section id="v-directorio" class="hide">
      <div class="panel">
        <div class="filtros">
          <div><label for="fprov">Provincia</label><select id="fprov"></select></div>
          <div><label for="fmuni">Municipio</label><select id="fmuni"></select></div>
          <div><label for="fesp">Especialidad</label><select id="fesp"></select></div>
          <div><label for="fest">Estado comercial</label><select id="fest"></select></div>
          <div><label for="forden">Ordenar por</label>
            <select id="forden">
              <option value="nombre">Nombre</option>
              <option value="urgentes">Urgentes primero</option>
              <option value="reciente">Visita más reciente</option>
            </select></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="acts" style="padding:12px 14px 0;margin:0"><button class="btn sec" id="nuevoBtn">+ Crear nuevo</button><button class="btn sec" id="mapaBtn">Ver mapa</button><button class="btn sec" id="guardarFiltro">★ Guardar filtro</button><button class="btn sec" id="colsBtn">⚙ Columnas</button><button class="btn sec" id="cercaBtn">Cerca de mí</button><button class="btn sec hide" id="dupBtn">Duplicados</button><button class="btn sec" id="dirtools" title="Filtros, columnas y descargas">⋮</button></div>
        <div class="cuenta" id="cuenta">Cargando…</div>
        <div id="mapawrap" class="hide"><div id="mapa"></div><div class="mapleg" id="mapleg"></div></div>
        <div class="sm hide" id="scrollhint" style="padding:8px 14px 0">Desliza a los lados para ver todas las columnas</div>
        <div class="tabla" id="tabla"><div class="thead" id="thead"></div><div id="lista"></div></div>
        <button class="mas hide" id="mas">Cargar más</button>
      </div>
    </section>

    <section id="v-agenda" class="hide"></section>
    <section id="v-rutas" class="hide"></section>
    <section id="v-seguimiento" class="hide"></section>
    <section id="v-ventas" class="hide"></section>
    <section id="v-analitica" class="hide"></section>
    <section id="v-config" class="hide"></section>
    <section id="v-admin" class="hide"></section>
  </main>
</div>

<dialog id="ficha"><div class="fbox" id="fbody"></div></dialog>
<dialog id="dlg"><div class="fbox" id="dbody"></div></dialog>
<dialog id="mini" class="mini"></dialog>
<dialog id="dlg2"><div class="fbox" id="dlg2body"></div></dialog>
<aside id="tools" class="tools"></aside>
<div id="toast" class="toast hide"></div>
<div id="conex" class="conex hide"></div>
<div id="rutabar" class="rutabar hide"></div>
<div id="nuevaver" class="upd hide"><span>Hay una versión nueva de la app</span><button class="btn" id="actualizar">Actualizar</button></div>
<nav class="bnav" id="bnav">
  <button data-t="inicio"><span>◉</span>Inicio</button>
  <button data-t="agenda"><span>▤</span>Agenda</button>
  <button data-t="rutas"><span>➤</span>Rutas</button>
  <button data-t="directorio"><span>☰</span>Directorio</button>
  <button data-t="seguimiento"><span>✓</span>Segui.</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js?v=2.14.0"></script>
</body>
</html>
